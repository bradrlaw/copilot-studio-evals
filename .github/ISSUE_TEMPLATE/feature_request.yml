name: Feature request
description: Propose an improvement to the framework, workflow, or documentation.
title: "[Feature]: "
labels:
  - enhancement
body:
  - type: markdown
    attributes:
      value: |
        Thanks for suggesting an improvement. Explain the evaluation problem first
        so the proposed solution can be assessed in context.

  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What limitation or workflow problem should be addressed?
      placeholder: Describe who is affected and why the current behavior is insufficient.
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: Describe the desired behavior without including confidential agent details.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: What other approaches or workarounds have you considered?

  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Evaluation design and process
        - Canonical schema and validation
        - Telemetry extraction
        - Copilot Studio export
        - Copilot Studio Kit export
        - Evaluation execution
        - Results and reporting
        - Observability and latency
        - Documentation
        - Other
    validations:
      required: true

  - type: textarea
    id: acceptance
    attributes:
      label: Suggested acceptance criteria
      description: How would maintainers know the request is complete?

  - type: checkboxes
    id: confirmations
    attributes:
      label: Confirmations
      options:
        - label: I searched for an existing request before creating this one.
          required: true
        - label: This request contains no credentials, personal data, production conversations, or confidential identifiers.
          required: true
